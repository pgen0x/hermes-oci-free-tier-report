<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">OCI Free Tier Report</title>
  <desc id="d">Daily Oracle Cloud Always Free usage report for Hermes cron: zero cost, zero AI tokens.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#151C2F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF7A45"/>
      <stop offset="1" stop-color="#F43F5E"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F43F5E" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#F43F5E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity="0.05"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <circle cx="1000" cy="300" r="380" fill="url(#glow)"/>

  <g transform="translate(0,92)" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect x="72" y="66" width="214" height="32" rx="16" fill="#FF7A45" fill-opacity="0.12" stroke="#FF7A45" stroke-opacity="0.5"/>
    <text x="179" y="87" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2.2" fill="#FF9A6E">HERMES AGENT SKILL</text>

    <text x="70" y="168" font-size="64" font-weight="800" fill="#F5F7FB" letter-spacing="-1">OCI Free Tier</text>
    <text x="70" y="238" font-size="64" font-weight="800" fill="url(#accent)" letter-spacing="-1">Usage Report</text>

    <text x="72" y="284" font-size="20" fill="#9AA4B8">Daily Oracle Cloud Always Free usage check for Hermes cron.</text>
    <text x="72" y="312" font-size="20" fill="#9AA4B8">Zero cost. Zero AI tokens. Native tables in your chat.</text>

    <g font-size="15" font-weight="600" fill="#C9D1E0">
      <rect x="72" y="342" width="104" height="34" rx="17" fill="#1E2840" stroke="#2C3858"/>
      <text x="124" y="364" text-anchor="middle">Telegram</text>
      <rect x="188" y="342" width="96" height="34" rx="17" fill="#1E2840" stroke="#2C3858"/>
      <text x="236" y="364" text-anchor="middle">Discord</text>
      <rect x="296" y="342" width="114" height="34" rx="17" fill="#1E2840" stroke="#2C3858"/>
      <text x="353" y="364" text-anchor="middle">WhatsApp</text>
      <rect x="422" y="342" width="80" height="34" rx="17" fill="#1E2840" stroke="#2C3858"/>
      <text x="462" y="364" text-anchor="middle">Slack</text>
      <rect x="514" y="342" width="84" height="34" rx="17" fill="#1E2840" stroke="#2C3858"/>
      <text x="556" y="364" text-anchor="middle">+ more</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="790" y="56" width="420" height="318" rx="18" fill="#1A2236" stroke="#2C3858"/>
    </g>
    <circle cx="818" cy="84" r="5" fill="#F43F5E"/>
    <circle cx="836" cy="84" r="5" fill="#F59E0B"/>
    <circle cx="854" cy="84" r="5" fill="#22C55E"/>
    <text x="814" y="120" font-size="17" font-weight="700" fill="#F5F7FB">OCI Always Free · Mon 16 Nov</text>
    <text x="814" y="142" font-size="13" fill="#7C879D">daily at 07:00 · no-agent cron</text>
    <line x1="814" y1="158" x2="1186" y2="158" stroke="#2C3858"/>

    <g font-size="15" fill="#C9D1E0">
      <text x="814" y="190">Cost this month</text>
      <text x="814" y="224">A1 OCPU-hours</text>
      <text x="814" y="258">A1 GB-hours</text>
      <text x="814" y="292">Block storage</text>
      <text x="814" y="326">Outbound data</text>
      <text x="814" y="360">Idle reclaim risk</text>
    </g>
    <g font-size="15" fill="#F5F7FB" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="1160" y="190">0.00</text>
      <text x="1160" y="224">1,488 / 3,000</text>
      <text x="1160" y="258">8,928 / 18,000</text>
      <text x="1160" y="292">200 / 200 GB</text>
      <text x="1160" y="326">3 / 10,240 GB</text>
      <text x="1160" y="360">none</text>
    </g>
    <g>
      <circle cx="1180" cy="185" r="6" fill="#22C55E"/>
      <circle cx="1180" cy="219" r="6" fill="#22C55E"/>
      <circle cx="1180" cy="253" r="6" fill="#22C55E"/>
      <circle cx="1180" cy="287" r="6" fill="#F59E0B"/>
      <circle cx="1180" cy="321" r="6" fill="#22C55E"/>
      <circle cx="1180" cy="355" r="6" fill="#22C55E"/>
    </g>
  </g>
  <line x1="72" y1="560" x2="1208" y2="560" stroke="#2C3858"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18">
    <text x="72" y="596" fill="#9AA4B8">github.com/<tspan fill="#F5F7FB" font-weight="700">pgen0x/hermes-oci-free-tier-report</tspan></text>
    <text x="1208" y="596" text-anchor="end" fill="#7C879D">MIT · open source</text>
  </g>
</svg>
